name: Load live backend adapter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Place live backend and UI guard last with cache-busting
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script\s+src=["\']bap-live-backend\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)
          s = re.sub(r'<script\s+src=["\']bap-live-ui-guard\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)
          version = os.environ['GITHUB_SHA'][:12]
          s = s.rstrip() + f'\n<script src="bap-live-backend.js?v={version}"></script>\n<script src="bap-live-ui-guard.js?v={version}"></script>\n'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit injection
        run: |
          git config user.name "book-a-partner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Live backend and UI guard are already current."
            exit 0
          fi
          git commit -m "Refresh live adapter cache version"
          git push
