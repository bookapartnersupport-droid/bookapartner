name: Load live backend adapter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Place live backend, UI guard, final search override, and Razorpay methods last
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          version = os.environ['GITHUB_SHA'][:12]
          for filename in ['index.html','fresh.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              for name in ['bap-live-backend.js','bap-live-ui-guard.js','bap-force-search.js']:
                  pattern = r"<script\s+src=[\"']" + re.escape(name) + r"(?:\?[^\"']*)?[\"']\s*></script>"
                  s = re.sub(pattern, '', s, flags=re.I)
              s = s.rstrip() + f'\n<script src="bap-live-backend.js?v={version}"></script>\n<script src="bap-live-ui-guard.js?v={version}"></script>\n<script src="bap-force-search.js?v={version}"></script>\n'
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit injection
        run: |
          git config user.name "book-a-partner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html fresh.html
          if git diff --cached --quiet; then
            echo "Live scripts are already current."
            exit 0
          fi
          git commit -m "Load Razorpay UPI override last"
          git push
