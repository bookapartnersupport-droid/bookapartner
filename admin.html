<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Book A Partner — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f5fb;color:#171b2b}.hidden{display:none!important}.wrap{max-width:1400px;margin:auto;padding:22px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#201446,#6a2fd0)}.loginBox{width:min(430px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 70px #0004}.logoText{font-size:28px;font-weight:900;color:#5420b5;margin-bottom:5px}.muted{color:#737b91}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #d8d5e2;border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#6324ca;color:#fff}.danger{background:#fee4e6;color:#b42318}.soft{background:#f0ebff;color:#5420b5}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#fff;border:1px solid #e3e0eb;border-radius:16px;padding:15px 18px;margin-bottom:18px}.brand{font-weight:900;font-size:20px;color:#5420b5}.user{font-size:12px;color:#697188}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.metric{background:#fff;border:1px solid #e3e0eb;border-radius:15px;padding:16px}.metric b{display:block;font-size:25px;margin-top:5px}.metric span{font-size:12px;color:#737b91}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{background:#fff;border:1px solid #ddd8e8;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#6324ca;color:#fff;border-color:#6324ca}.panel{background:#fff;border:1px solid #e3e0eb;border-radius:16px;padding:18px;overflow:auto}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel h2{margin:0;font-size:18px}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#f1f3f7;font-size:11px;font-weight:800}.ok{background:#e9f9ef;color:#087443}.warn{background:#fff4d6;color:#8a5b00}.bad{background:#fee4e6;color:#b42318}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top}th{background:#faf9fc;font-size:11px;text-transform:uppercase;letter-spacing:.4px}.empty{text-align:center;color:#7a8295;padding:30px}.actions{display:flex;gap:6px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:11px;background:#fff8df;color:#705300;margin-bottom:15px;font-size:13px}.error{padding:12px 14px;border-radius:11px;background:#fff0f1;color:#a21b2a;margin:12px 0;font-size:13px;white-space:pre-wrap}.success{padding:12px 14px;border-radius:11px;background:#eaf9f0;color:#087443;margin:12px 0;font-size:13px}.detail{max-width:420px;white-space:normal;word-break:break-word}.footerNote{font-size:11px;color:#858b9c;margin-top:15px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.wrap{padding:12px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.loginBox{padding:22px}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="loginBox">
    <div class="logoText">Book A Partner</div>
    <div class="muted">Secure Admin Console</div>
    <div id="loginMsg"></div>
    <form id="loginForm">
      <div class="field"><label>Admin Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%" type="submit">Admin Login</button>
    </form>
    <div class="footerNote">Admin access is controlled by Supabase Auth + database RLS. This page does not store passwords.</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <div class="top">
      <div><div class="brand">Book A Partner — Admin</div><div id="who" class="user"></div></div>
      <button id="logoutBtn" class="btn soft">Logout</button>
    </div>
    <div id="globalMsg"></div>
    <div class="grid">
      <div class="metric"><span>Partner Applications</span><b id="mApplications">—</b></div>
      <div class="metric"><span>Approved / Live</span><b id="mApproved">—</b></div>
      <div class="metric"><span>Customers</span><b id="mCustomers">—</b></div>
      <div class="metric"><span>Bookings</span><b id="mBookings">—</b></div>
      <div class="metric"><span>Open Disputes</span><b id="mDisputes">—</b></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="applications">Partner Applications</button>
      <button class="tab" data-tab="partners">Partners</button>
      <button class="tab" data-tab="customers">Customers</button>
      <button class="tab" data-tab="bookings">Bookings</button>
      <button class="tab" data-tab="disputes">Disputes</button>
      <button class="tab" data-tab="raw">Data Inspector</button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://wmawmdwjibvlqsugthhe.supabase.co';
const SUPABASE_KEY='sb_publishable_mm_Qov_zXz5tUrlifTj_Ww_rD53yRmI';
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

let currentTab='applications';
let cache={applications:[],partners:[],customers:[],bookings:[],disputes:[]};

const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function msg(text,type='error'){const cls=type==='success'?'success':'error';$('globalMsg').innerHTML=`<div class="${cls}">${esc(text)}</div>`;setTimeout(()=>{$('globalMsg').innerHTML=''},7000)}
function loginMsg(text){$('loginMsg').innerHTML=`<div class="error">${esc(text)}</div>`}
function statusClass(v){const s=String(v||'').toLowerCase();if(s.includes('approved')||s.includes('live')||s.includes('completed')||s==='ok')return'ok';if(s.includes('reject')||s.includes('ban')||s.includes('suspend')||s.includes('open'))return'bad';if(s.includes('pending')||s.includes('hold')||s.includes('review'))return'warn';return''}
function pill(v){return `<span class="status ${statusClass(v)}">${esc(v||'—')}</span>`}
function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString('en-IN')}catch{return String(v)}}

async function isAdmin(user){
  if(!user)return false;
  const {data,error}=await db.from('user_profiles').select('*').eq('id',user.id).maybeSingle();
  if(error)throw error;
  if(!data)return false;
  const role=String(data.role||data.user_role||data.account_role||'').toLowerCase();
  return ['admin','super_admin','operations_admin','safety_admin','safety_support_admin','finance_admin'].includes(role);
}

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){$('loginView').classList.remove('hidden');$('app').classList.add('hidden');return;}
  try{
    const ok=await isAdmin(session.user);
    if(!ok){await db.auth.signOut();$('loginView').classList.remove('hidden');$('app').classList.add('hidden');loginMsg('This account does not have Admin access.');return;}
    $('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session.user.email||session.user.id;await refreshAll();render();
  }catch(e){await db.auth.signOut();$('loginView').classList.remove('hidden');$('app').classList.add('hidden');loginMsg(e.message||'Unable to verify Admin access.');}
}

async function loadTable(name,select='*'){const {data,error}=await db.from(name).select(select).order('created_at',{ascending:false});if(error)throw new Error(name+': '+error.message);return data||[]}
async function refreshAll(){
  const results=await Promise.allSettled([
    loadTable('partner_applications'),loadTable('partners'),loadTable('user_profiles'),loadTable('bookings'),loadTable('disputes')
  ]);
  const names=['applications','partners','customers','bookings','disputes'];
  results.forEach((r,i)=>{cache[names[i]]=r.status==='fulfilled'?r.value:[]});
  $('mApplications').textContent=cache.applications.length;
  $('mApproved').textContent=cache.partners.filter(p=>/approved|live/i.test(String(p.verification_status||p.status||p.verification||''))).length;
  $('mCustomers').textContent=cache.customers.filter(p=>/customer/i.test(String(p.role||p.user_role||p.account_role||''))).length||cache.customers.length;
  $('mBookings').textContent=cache.bookings.length;
  $('mDisputes').textContent=cache.disputes.filter(d=>!/resolved|closed|rejected/i.test(String(d.status||''))).length;
}

function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));
  if(currentTab==='applications')renderApplications();
  if(currentTab==='partners')renderGeneric('partners','Partners');
  if(currentTab==='customers')renderGeneric('customers','Customers');
  if(currentTab==='bookings')renderGeneric('bookings','Bookings');
  if(currentTab==='disputes')renderGeneric('disputes','Disputes');
  if(currentTab==='raw')renderRaw();
}

function renderApplications(){
  const rows=cache.applications.map(a=>{
    const status=a.verification_status||a.status||'pending';
    return `<tr><td>${esc(a.id)}</td><td><b>${esc(a.full_name||a.name||'—')}</b><br>${esc(a.email||'')}</td><td>${esc(a.mobile||a.phone||'—')}</td><td>${esc(a.city||a.area||'—')}</td><td>${pill(status)}</td><td>${fmt(a.created_at)}</td><td><div class="actions">${/pending|call_pending|under_review/i.test(status)?`<button class="btn primary" onclick="reviewApplication('${esc(a.id)}','approved')">Approve</button><button class="btn danger" onclick="reviewApplication('${esc(a.id)}','rejected')">Reject</button>`:'—'}</div></td></tr>`;
  }).join('');
  $('panel').innerHTML=`<div class="panel"><div class="panelHead"><h2>Partner Applications</h2><button class="btn soft" onclick="refreshAndRender()">Refresh</button></div><div class="notice">Approval actions write to <b>partner_applications.verification_status</b>. Supabase RLS remains the final authorization layer.</div>${rows?`<table><thead><tr><th>ID</th><th>Applicant</th><th>Mobile</th><th>Area</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">No partner applications found.</div>'}</div>`;
}

async function reviewApplication(id,status){
  if(!confirm(`Set application ${id} to ${status}?`))return;
  const {error}=await db.from('partner_applications').update({verification_status:status}).eq('id',id);
  if(error){msg('Update failed: '+error.message);return}
  msg('Application updated successfully.','success');await refreshAll();render();
}

function keysFor(rows){const set=new Set();rows.slice(0,50).forEach(r=>Object.keys(r||{}).forEach(k=>set.add(k)));return [...set].slice(0,12)}
function renderGeneric(key,title){
  const rows=cache[key]||[];const keys=keysFor(rows);const body=rows.map(r=>`<tr>${keys.map(k=>`<td class="detail">${k.toLowerCase().includes('status')?pill(r[k]):esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])}</td>`).join('')}</tr>`).join('');
  $('panel').innerHTML=`<div class="panel"><div class="panelHead"><h2>${title}</h2><button class="btn soft" onclick="refreshAndRender()">Refresh</button></div>${rows.length?`<table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`:'<div class="empty">No records returned, or RLS is blocking this view.</div>'}</div>`;
}
function renderRaw(){
  const names=['applications','partners','customers','bookings','disputes'];
  $('panel').innerHTML=`<div class="panel"><div class="panelHead"><h2>Data Inspector</h2></div><div class="notice">This is an admin-only diagnostic view. Sensitive fields should remain protected by database RLS and role-based policies.</div>${names.map(n=>`<details style="margin:10px 0"><summary><b>${n}</b> (${cache[n].length})</summary><pre style="white-space:pre-wrap;font-size:11px;background:#faf9fc;padding:12px;border-radius:10px;overflow:auto">${esc(JSON.stringify(cache[n],null,2))}</pre></details>`).join('')}</div>`;
}
async function refreshAndRender(){try{await refreshAll();render();msg('Data refreshed.','success')}catch(e){msg(e.message||'Refresh failed')}}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;render()}));
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg('');try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await start()}catch(err){loginMsg(err.message||'Admin login failed.')}});
$('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});
db.auth.onAuthStateChange(()=>start());
start();
</script>
</body>
</html>
