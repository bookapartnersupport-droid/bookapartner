<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Book A Partner — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f5fb;color:#171b2b}.hidden{display:none!important}.wrap{max-width:1400px;margin:auto;padding:22px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#201446,#6a2fd0)}.loginBox{width:min(430px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 70px #0004}.logoText{font-size:28px;font-weight:900;color:#5420b5}.muted{color:#737b91}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d8d5e2;border-radius:10px;font-size:14px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#6324ca;color:#fff}.danger{background:#fee4e6;color:#b42318}.soft{background:#f0ebff;color:#5420b5}.successBtn{background:#e9f9ef;color:#087443}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#fff;border:1px solid #e3e0eb;border-radius:16px;padding:15px 18px;margin-bottom:18px}.brand{font-weight:900;font-size:20px;color:#5420b5}.user{font-size:12px;color:#697188}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.metric{background:#fff;border:1px solid #e3e0eb;border-radius:15px;padding:16px}.metric b{display:block;font-size:25px;margin-top:5px}.metric span{font-size:12px;color:#737b91}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{background:#fff;border:1px solid #ddd8e8;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#6324ca;color:#fff;border-color:#6324ca}.panel{background:#fff;border:1px solid #e3e0eb;border-radius:16px;padding:18px;overflow:auto}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel h2{margin:0;font-size:18px}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#f1f3f7;font-size:11px;font-weight:800}.ok{background:#e9f9ef;color:#087443}.warn{background:#fff4d6;color:#8a5b00}.bad{background:#fee4e6;color:#b42318}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top}th{background:#faf9fc;font-size:11px;text-transform:uppercase;letter-spacing:.4px}.empty{text-align:center;color:#7a8295;padding:30px}.actions{display:flex;gap:6px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:11px;background:#fff8df;color:#705300;margin-bottom:15px;font-size:13px}.error{padding:12px 14px;border-radius:11px;background:#fff0f1;color:#a21b2a;margin:12px 0;font-size:13px;white-space:pre-wrap}.success{padding:12px 14px;border-radius:11px;background:#eaf9f0;color:#087443;margin:12px 0;font-size:13px}.detail{max-width:420px;white-space:normal;word-break:break-word}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:18px;z-index:50}.modal.show{display:grid}.modalBox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f1f3f7;border-radius:9px;padding:7px 11px;font-size:20px;cursor:pointer}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formGrid .full{grid-column:1/-1}.footerNote{font-size:11px;color:#858b9c;margin-top:15px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.formGrid{grid-template-columns:1fr}.formGrid .full{grid-column:auto}}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="loginBox"><div class="logoText">Book A Partner</div><div class="muted">Secure Admin Console</div><div id="loginMsg"></div><form id="loginForm"><div class="field"><label>Admin Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%" type="submit">Admin Login</button></form><div class="footerNote">Admin access uses Supabase Auth and database RLS. Passwords are never stored by this page.</div></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div><div class="brand">Book A Partner — Admin</div><div id="who" class="user"></div></div><button id="logoutBtn" class="btn soft">Logout</button></div><div id="globalMsg"></div>
<div class="grid"><div class="metric"><span>Partner Applications</span><b id="mApplications">—</b></div><div class="metric"><span>Approved / Live</span><b id="mApproved">—</b></div><div class="metric"><span>Customers</span><b id="mCustomers">—</b></div><div class="metric"><span>Bookings</span><b id="mBookings">—</b></div><div class="metric"><span>Open Disputes</span><b id="mDisputes">—</b></div></div>
<div class="tabs"><button class="tab active" data-tab="applications">Partner Applications</button><button class="tab" data-tab="partners">Partner Management</button><button class="tab" data-tab="customers">Customers</button><button class="tab" data-tab="bookings">Bookings</button><button class="tab" data-tab="disputes">Disputes</button><button class="tab" data-tab="raw">Data Inspector</button></div><div id="panel"></div></div></div>
<div id="partnerModal" class="modal"><div class="modalBox"><div class="modalHead"><h2 style="margin:0">Partner Management</h2><button class="close" onclick="closePartnerModal()">×</button></div><div id="partnerDetail" style="margin-top:14px"></div></div></div>
<script>
const SUPABASE_URL='https://wmawmdwjjbvlqsugthhe.supabase.co';
const SUPABASE_KEY='sb_publishable_mm_Qov_zXz5tUrlifTj_Ww_rD53yRmI';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentTab='applications';let cache={applications:[],partners:[],customers:[],bookings:[],disputes:[]};
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function msg(text,type='error'){const c=type==='success'?'success':'error';$('globalMsg').innerHTML=`<div class="${c}">${esc(text)}</div>`;setTimeout(()=>{$('globalMsg').innerHTML=''},7000)}
function loginMsg(text){$('loginMsg').innerHTML=text?`<div class="error">${esc(text)}</div>`:''}
function statusClass(v){const s=String(v||'').toLowerCase();if(/approved|live|completed|active/.test(s))return'ok';if(/reject|ban|suspend|deactiv|blocked/.test(s))return'bad';if(/pending|hold|review|warning/.test(s))return'warn';return''}
function pill(v){return `<span class="status ${statusClass(v)}">${esc(v||'—')}</span>`}
function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString('en-IN')}catch{return String(v)}}
function pick(o,keys,def=''){for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return def}
function partnerStatus(p){return pick(p,['status','verification_status','verification'],'Pending')}
async function isAdmin(user){if(!user)return false;const email=String(user.email||'').trim().toLowerCase();if(email==='bookapartner.support@gmail.com')return true;const {data,error}=await db.from('user_profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;if(!data)return false;const role=String(pick(data,['role','user_role','account_role'],'')).toLowerCase();return ['admin','super_admin','operations_admin','safety_admin','safety_support_admin','finance_admin'].includes(role)}
let starting=false;async function start(sessionOverride=undefined){if(starting)return;starting=true;try{const session=sessionOverride===undefined?(await db.auth.getSession()).data.session:sessionOverride;if(!session){$('loginView').classList.remove('hidden');$('app').classList.add('hidden');return}if(!(await isAdmin(session.user))){await db.auth.signOut();$('loginView').classList.remove('hidden');$('app').classList.add('hidden');loginMsg('This account does not have Admin access.');return}$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session.user.email||session.user.id;await refreshAll();render()}catch(e){await db.auth.signOut();$('loginView').classList.remove('hidden');$('app').classList.add('hidden');loginMsg(e.message||'Unable to verify Admin access.')}finally{starting=false}}
async function loadTable(name){const {data,error}=await db.from(name).select('*').order('created_at',{ascending:false});if(error)throw new Error(name+': '+error.message);return data||[]}
async function refreshAll(){const rs=await Promise.allSettled([loadTable('partner_applications'),loadTable('partners'),loadTable('user_profiles'),loadTable('bookings'),loadTable('disputes')]);['applications','partners','customers','bookings','disputes'].forEach((n,i)=>{cache[n]=rs[i].status==='fulfilled'?rs[i].value:[]});$('mApplications').textContent=cache.applications.length;$('mApproved').textContent=cache.partners.filter(p=>/approved|live/i.test(partnerStatus(p))).length;$('mCustomers').textContent=cache.customers.filter(p=>/customer/i.test(String(pick(p,['role','user_role','account_role'],'')))).length;$('mBookings').textContent=cache.bookings.length;$('mDisputes').textContent=cache.disputes.filter(d=>!/resolved|closed|rejected/i.test(String(pick(d,['status'],'open')))).length}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));({applications:renderApplications,partners:renderPartners,customers:()=>renderGeneric('customers','Customers'),bookings:()=>renderGeneric('bookings','Bookings'),disputes:()=>renderGeneric('disputes','Disputes'),raw:renderRaw})[currentTab]()}
function renderApplications(){const rows=cache.applications.map(a=>{const s=pick(a,['verification_status','status'],'pending');return `<tr><td>${esc(a.id)}</td><td><b>${esc(pick(a,['full_name','name'],'—'))}</b><br>${esc(a.email||'')}</td><td>${esc(pick(a,['mobile','phone'],'—'))}</td><td>${esc(pick(a,['city','area'],'—'))}</td><td>${pill(s)}</td><td>${fmt(a.created_at)}</td><td><div class="actions"><button class="btn soft" onclick="openApplicationReview('${esc(a.id)}')">Review</button>${/pending|call_pending|under_review/i.test(s)?`<button class="btn primary" onclick="reviewApplication('${esc(a.id)}','approved')">Approve</button><button class="btn danger" onclick="reviewApplication('${esc(a.id)}','rejected')">Reject</button>`:' '}</div></td></tr>}).join('');$('panel').innerHTML=`<div class="panel"><div class="panelHead"><h2>Partner Applications</h2><button class="btn soft" onclick="refreshAndRender()">Refresh</button></div><div class="notice">Review applicant details before approval. Approval creates/updates the live partner record as <b>approved + active</b>.</div>${rows?`<table><thead><tr><th>ID</th><th>Applicant</th><th>Mobile</th><th>Area</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">No partner applications found.</div>'}</div>`}
function findApplication(id){return cache.applications.find(a=>String(a.id)===String(id))}
function openApplicationReview(id){const a=findApplication(id);if(!a)return;const s=pick(a,['verification_status','status'],'pending');$('partnerDetail').innerHTML=`<div class="notice"><b>Partner Application</b><br>${pill(s)}<br><small>ID: ${esc(a.id)}</small></div><div class="formGrid"><div class="field"><label>Full Name</label><input value="${esc(a.full_name||'')}" readonly></div><div class="field"><label>Mobile</label><input value="${esc(a.mobile||'')}" readonly></div><div class="field"><label>Age / Gender</label><input value="${esc(a.age||'')} / ${esc(a.gender||'')}" readonly></div><div class="field"><label>City / Area</label><input value="${esc((a.city||'')+' / '+(a.area||''))}" readonly></div><div class="field"><label>Service</label><input value="${esc(Array.isArray(a.services)?a.services.join(', '):(a.services||''))}" readonly></div><div class="field"><label>Hourly Rate</label><input value="₹${esc(a.hourly_rate||'')}" readonly></div><div class="field"><label>Availability</label><input value="${esc(a.availability||'')}" readonly></div><div class="field"><label>Agreements</label><input value="${a.terms_accepted?'Terms ✓':'Terms ✗'} • ${a.safety_accepted?'Safety ✓':'Safety ✗'}" readonly></div><div class="field full"><label>Profile Photo Path</label><input value="${esc(a.profile_photo_path||'—')}" readonly></div><div class="field full"><label>Selfie Path</label><input value="${esc(a.selfie_path||'—')}" readonly></div><div class="field full"><label>Verification Note</label><textarea rows="3" readonly>${esc(a.verification_notes||'—')}</textarea></div></div><div class="actions" style="margin-top:12px">${/pending|call_pending|under_review/i.test(s)?`<button class="btn primary" onclick="reviewApplication('${esc(a.id)}','approved')">Approve & Make Live</button><button class="btn danger" onclick="reviewApplication('${esc(a.id)}','rejected')">Reject Application</button>`:'<span class="muted">This application has already been reviewed.</span>'}<button class="btn soft" onclick="closePartnerModal()">Close</button></div>`;$('partnerModal').classList.add('show')}
async function reviewApplication(id,status){const note=prompt((status==='approved'?'Approval note (optional):':'Rejection reason (required):'),'');if(status==='rejected'&&!note?.trim()){alert('Rejection reason is required.');return}if(!confirm(`Set application ${id} to ${status}?`))return;try{const {data,error}=await db.rpc('bap_admin_review_partner_application',{p_application_id:id,p_status:status,p_note:note?.trim()||null});if(error)throw error;msg(status==='approved'?'Application approved and partner is now Live.':'Application rejected.','success');await refreshAll();render()}catch(e){msg('Review failed: '+(e.message||String(e)));}}
function renderPartners(){const rows=cache.partners.map(p=>{const s=partnerStatus(p);const id=pick(p,['id','partner_id'],'');return `<tr><td>${esc(id)}</td><td><b>${esc(pick(p,['full_name','name','partner_name'],'—'))}</b><br>${esc(p.email||'')}</td><td>${esc(pick(p,['mobile','phone'],'—'))}</td><td>${esc(pick(p,['city','area'],'—'))}</td><td>${pill(s)}</td><td>${esc(pick(p,['verification_note','verificationNote'],'—'))}</td><td><div class="actions"><button class="btn soft" onclick="openPartnerModal('${esc(id)}')">Manage</button></div></td></tr>`}).join('');$('panel').innerHTML=`<div class="panel"><div class="panelHead"><h2>Partner Management</h2><button class="btn soft" onclick="refreshAndRender()">Refresh</button></div><div class="notice">Use this area for operational status changes: Live, Warning, Suspended, Deactivated or Banned. Each change requires a reason and is intended to be reviewed through the audit trail.</div>${rows?`<table><thead><tr><th>ID</th><th>Partner</th><th>Mobile</th><th>Area</th><th>Status</th><th>Admin Note</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">No partner records found.</div>'}</div>`}
function findPartner(id){return cache.partners.find(p=>String(p.id)===String(id)||String(p.partner_id||'')===String(id))}
function openPartnerModal(id){const p=findPartner(id);if(!p)return;const s=partnerStatus(p);$('partnerDetail').innerHTML=`<div class="notice"><b>Partner ID:</b> ${esc(id)} &nbsp; ${pill(s)}</div><div class="formGrid"><div class="field"><label>Operational Status</label><select id="pmStatus"><option>Live</option><option>Warning</option><option>Suspended</option><option>Deactivated</option><option>Banned</option><option>Pending</option></select></div><div class="field"><label>Verification Status</label><input id="pmVerification" value="${esc(pick(p,['verification_status','verification'],''))}"></div><div class="field full"><label>Admin Reason / Note (required for status change)</label><textarea id="pmNote" rows="4" placeholder="Reason, evidence reference, or operational note"></textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="savePartnerStatus('${esc(id)}')">Save Status</button><button class="btn soft" onclick="closePartnerModal()">Close</button></div><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><h3>Partner Record</h3><pre style="white-space:pre-wrap;font-size:11px;background:#faf9fc;padding:12px;border-radius:10px">${esc(JSON.stringify(p,null,2))}</pre>`;const select=$('pmStatus');select.value=['Live','Warning','Suspended','Deactivated','Banned','Pending'].includes(s)?s:'Pending';$('partnerModal').classList.add('show')}
function closePartnerModal(){$('partnerModal').classList.remove('show')}
async function savePartnerStatus(id){const status=$('pmStatus').value;const note=$('pmNote').value.trim();if(!note){alert('Admin reason/note is required.');return}const p=findPartner(id);if(!p)return;const idCol=p.id!==undefined?'id':'partner_id';const updates={status,admin_note:note};const {error}=await db.from('partners').update(updates).eq(idCol,id);if(error){msg('Partner status update failed: '+error.message);return}closePartnerModal();msg('Partner status updated successfully.','success');await refreshAll();render()}
function keysFor(rows){const set=new Set();rows.slice(0,50).forEach(r=>Object.keys(r||{}).forEach(k=>set.add(k)));return [...set].slice(0,14)}
function renderGeneric(key,title){const rows=cache[key]||[];const keys=keysFor(rows);const body=rows.map(r=>`<tr>${keys.map(k=>`<td class="detail">${k.toLowerCase().includes('status')?pill(r[k]):esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])}</td>`).join('')}</tr>`).join('');$('panel').innerHTML=`<div class="panel"><div class="panelHead"><h2>${title}</h2><button class="btn soft" onclick="refreshAndRender()">Refresh</button></div>${rows.length?`<table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`:'<div class="empty">No records returned, or RLS is blocking this view.</div>'}</div>`}
function renderRaw(){const names=['applications','partners','customers','bookings','disputes'];$('panel').innerHTML=`<div class="panel"><div class="panelHead"><h2>Data Inspector</h2></div><div class="notice">Admin-only diagnostic view. Do not expose this page publicly. Sensitive fields must remain protected by RLS.</div>${names.map(n=>`<details style="margin:10px 0"><summary><b>${n}</b> (${cache[n].length})</summary><pre style="white-space:pre-wrap;font-size:11px;background:#faf9fc;padding:12px;border-radius:10px;overflow:auto">${esc(JSON.stringify(cache[n],null,2))}</pre></details>`).join('')}</div>`}
async function refreshAndRender(){try{await refreshAll();render();msg('Data refreshed.','success')}catch(e){msg(e.message||'Refresh failed')}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{currentTab=b.dataset.tab;render()}));
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg('');const btn=e.submitter;if(btn)btn.disabled=true;try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!data?.session)throw new Error('Login succeeded but no active session was returned.');await start(data.session)}catch(err){loginMsg(err.message||'Admin login failed.')}finally{if(btn)btn.disabled=false}});
$('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});
// IMPORTANT: Supabase documents a deadlock risk when async Supabase calls are made directly inside onAuthStateChange.
// Keep the auth callback synchronous and defer application work to the next event-loop turn.
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='INITIAL_SESSION'){setTimeout(()=>start(session),0)}});
// INITIAL_SESSION from Supabase is the single initial-session source; avoid a second concurrent getSession() call.

</script></body></html>
