<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book A Partner — Reconciliation Center</title>
<style>
body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center}main{max-width:1250px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.num{font-size:25px;font-weight:800}.muted{color:#667085;font-size:13px}.toolbar{margin:18px 0;display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.table{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#f9fafb}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff}.ok{background:#ecfdf3}.warn{background:#fff7ed}.bad{background:#fef2f2}button{border:0;border-radius:8px;padding:8px 11px;cursor:pointer;background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.box{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{background:#f8fafc;padding:11px;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.error{color:#b42318;background:#fef3f2;padding:10px;border-radius:8px;margin:10px 0}.success{color:#067647;background:#ecfdf3;padding:10px;border-radius:8px;margin:10px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><strong>Book A Partner</strong><div class="muted" style="color:#cbd5e1">E14 · Reconciliation Center</div></div><button id="logout">Logout</button></header>
<main>
<div id="msg"></div>
<div class="grid">
<div class="card"><div class="muted">Transactions</div><div class="num" id="total">0</div></div>
<div class="card"><div class="muted">Matched</div><div class="num" id="matched">0</div></div>
<div class="card"><div class="muted">Review Needed</div><div class="num" id="review">0</div></div>
<div class="card"><div class="muted">Gross Paid</div><div class="num" id="gross">₹0</div></div>
<div class="card"><div class="muted">Refunds</div><div class="num" id="refunds">₹0</div></div>
</div>
<div class="toolbar"><input id="search" placeholder="Search booking / customer / partner / reference"><select id="filter"><option value="all">All</option><option value="matched">Matched</option><option value="review">Review Needed</option><option value="payment_missing">Payment Missing</option><option value="refund_mismatch">Refund Mismatch</option><option value="payout_mismatch">Payout Mismatch</option></select><button id="refresh">Refresh</button></div>
<div class="table"><table><thead><tr><th>Booking</th><th>Payment Ref</th><th>Customer</th><th>Partner</th><th>Gross</th><th>Refund</th><th>Payout</th><th>Reconciliation</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="9">Loading…</td></tr></tbody></table></div>
</main>
<div class="modal" id="modal"><div class="box"><h2>Reconciliation Record</h2><div id="detail"></div><div class="actions"><button class="secondary" id="close">Close</button><button id="mark">Mark Reviewed</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://wmawmdwjibvlqsugthhe.supabase.co';
const SUPABASE_KEY='sb_publishable_mm_Qov_zXz5tUrlifTj_Ww_rD53yRmI';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let all=[], current=null;
const pick=(o,keys,def=null)=>{for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return def};
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(t,ok=false){document.getElementById('msg').innerHTML='<div class="'+(ok?'success':'error')+'">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',3500)}
async function guard(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='index.html';return false}const {data:p,error}=await sb.from('user_profiles').select('*').eq('id',user.id).maybeSingle();if(error||!p||String(pick(p,['role','user_role','account_type'],'')).toLowerCase()!=='admin'){document.body.innerHTML='<main><div class="card"><h2>Admin access required</h2><p>Please sign in with an authorized admin account.</p></div></main>';return false}return true}
function val(b,keys){return pick(b,keys,'')}
function analyze(b){const gross=Number(val(b,['amount','total_amount','paid_amount','payment_amount','gross_amount'],0))||0;const refund=Number(val(b,['refund_amount','refunded_amount','refund_total'],0))||0;const payout=Number(val(b,['payout_amount','partner_payout','payout_net','partner_net'],0))||0;const payStatus=String(val(b,['payment_status','paymentState','payment_state'],'' )).toLowerCase();const payRef=val(b,['payment_reference','payment_ref','transaction_id','payment_id','gateway_payment_id'], '');const refundStatus=String(val(b,['refund_status','refund_state'],'' )).toLowerCase();const payoutStatus=String(val(b,['payout_status','payout_state'],'' )).toLowerCase();let issues=[];if(gross>0&&!payRef)issues.push('Payment reference missing');if(refund>gross&&gross>0)issues.push('Refund exceeds payment');if(payout>gross&&gross>0)issues.push('Payout exceeds payment');if(refund>0&&refundStatus==='')issues.push('Refund status missing');if(payout>0&&payoutStatus==='')issues.push('Payout status missing');if(payStatus==='failed'&&gross>0)issues.push('Payment failed with amount');const matched=issues.length===0&&((gross===0)||(!!payRef));let type=matched?'matched':'review';if(issues.some(x=>x.includes('Refund')))type='refund_mismatch';else if(issues.some(x=>x.includes('Payout')))type='payout_mismatch';else if(issues.some(x=>x.includes('Payment reference')))type='payment_missing';return {gross,refund,payout,payStatus,payRef,refundStatus,payoutStatus,issues,matched,type}}
function render(){const q=document.getElementById('search').value.toLowerCase();const f=document.getElementById('filter').value;const data=all.filter(b=>{const a=analyze(b);const text=JSON.stringify(b).toLowerCase();return (!q||text.includes(q))&&(f==='all'||(f==='matched'?a.matched:f===a.type))});document.getElementById('rows').innerHTML=data.length?data.map((b,i)=>{const a=analyze(b);const status=a.matched?'Matched':'Review Needed';return '<tr><td>'+esc(val(b,['booking_id','id','booking_ref'],'—'))+'</td><td>'+esc(a.payRef||'—')+'</td><td>'+esc(val(b,['customer_name','customer_id','user_id'],'—'))+'</td><td>'+esc(val(b,['partner_name','partner_id'],'—'))+'</td><td>'+money(a.gross)+'</td><td>'+money(a.refund)+'</td><td>'+money(a.payout)+'</td><td><span class="pill '+(a.matched?'ok':'warn')+'">'+status+'</span></td><td><button onclick="openRec(${i},'${esc(JSON.stringify(b).replace(/'/g,"&#39;"))}')">Review</button></td></tr>'}).join(''):'<tr><td colspan="9">No reconciliation records found.</td></tr>';document.getElementById('total').textContent=all.length;document.getElementById('matched').textContent=all.filter(b=>analyze(b).matched).length;document.getElementById('review').textContent=all.filter(b=>!analyze(b).matched).length;document.getElementById('gross').textContent=money(all.reduce((s,b)=>s+analyze(b).gross,0));document.getElementById('refunds').textContent=money(all.reduce((s,b)=>s+analyze(b).refund,0))}
window.openRec=(i)=>{const b=all[i];current=b;const a=analyze(b);document.getElementById('detail').innerHTML='<div class="row"><div class="field"><b>Booking</b><br>'+esc(val(b,['booking_id','id'],'—'))+'</div><div class="field"><b>Payment Reference</b><br>'+esc(a.payRef||'—')+'</div><div class="field"><b>Gross Paid</b><br>'+money(a.gross)+'</div><div class="field"><b>Refund</b><br>'+money(a.refund)+'</div><div class="field"><b>Partner Payout</b><br>'+money(a.payout)+'</div><div class="field"><b>Payment Status</b><br>'+esc(a.payStatus||'—')+'</div><div class="field"><b>Refund Status</b><br>'+esc(a.refundStatus||'—')+'</div><div class="field"><b>Payout Status</b><br>'+esc(a.payoutStatus||'—')+'</div></div><h3>'+ (a.matched?'Reconciliation matched':'Review required') +'</h3>'+(a.issues.length?'<ul>'+a.issues.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>No detected mismatch.</p>')+'<details><summary>Source booking record</summary><pre>'+esc(JSON.stringify(b,null,2))+'</pre></details>';document.getElementById('modal').classList.add('on')};
async function load(){document.getElementById('rows').innerHTML='<tr><td colspan="9">Loading…</td></tr>';const {data,error}=await sb.from('bookings').select('*').order('created_at',{ascending:false});if(error){show('Could not load bookings: '+error.message);return}all=data||[];render()}
document.getElementById('refresh').onclick=load;document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('on');document.getElementById('mark').onclick=()=>{if(current){show('Reviewed in this admin session. Persistent reconciliation ledger will be connected with the final ledger schema.',true);document.getElementById('modal').classList.remove('on')}};document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};(async()=>{if(await guard())load()})();
</script>
</body></html>
